name: Candidate verification (not production acceptance)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, test:database, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.check }}
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  dependency-and-harness-checks:
    name: Dependency audit / isolated load harness contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm test:local-harnesses

# No hosted Supabase credentials, source exports or production sessions are
# available here. Native PostgreSQL, actual Google login, 89-page interaction,
# 50-user staging load and operational recovery remain separate release gates.
# This workflow does not deploy or promote an application.
